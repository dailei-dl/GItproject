services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: designtwin
      POSTGRES_USER: designtwin
      POSTGRES_PASSWORD: designtwin_demo_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designtwin -d designtwin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2026-05-21T15-45-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: designtwin_demo_minio
      MINIO_ROOT_PASSWORD: designtwin_demo_minio_password
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_PUBLIC_URL: http://localhost
      DATABASE_URL: postgresql://designtwin:designtwin_demo_password@postgres:5432/designtwin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-with-local-development-secret
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: designtwin_demo_minio
      MINIO_SECRET_KEY: designtwin_demo_minio_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
